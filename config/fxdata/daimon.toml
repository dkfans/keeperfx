# the built-in AI (COMPUTER_PLAYER(player, model)) plays as Daimon with the personality named for its model here; a
# model not named plays the default.
0 = "steward"
1 = "steward"
2 = "turtle"
3 = "builder"
4 = "builder"
5 = "steward"
10 = "warlord"
11 = "turtle"
12 = "swarm"
13 = "turtle"
14 = "builder"
15 = "steward"
16 = "warlord"
