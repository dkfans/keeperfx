[FULL_MOON_MAP_VIEW]
ENG = "A painting of our homeland, taken over by the Keeper Sapphire. A menacing and powerful Keeper, who has long terrorized and threatened this land. When moonlight shines on the painting, it almost seems to come alive..."
GER = "Ein Gemälde unserer Heimat, erobert vom Keeper Sapphire. Ein gefährlicher und starker Keeper, der dieses Reich schon seit langem bedroht. Wenn Mondlicht auf das Gemälde scheint, kommt es einem fast wie echt vor..."

