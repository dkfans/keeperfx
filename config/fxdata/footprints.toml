# Index is the tmapa file. WINTER is script id 3 and tmapa002.dat, so [texture2].
# Effect element, path slabs only. Sound is FootstepSound on it; unset plays FOOT_SNOW.
# Map or campaign files replace listed blocks. tmapa014 stays unset (script 14 is texture13).
#
#  0 STANDARD          5 VOLUPTUOUS        10 LILAC_STONE
#  1 ANCIENT           6 ROUGH_ANCIENT     11 SWAMP_SERPENT
#  2 WINTER            7 SKULL_RELIEF      12 LAVA_CAVERN
#  3 SNAKE_KEY         8 DESERT_TOMB       13 LATERITE_CAVERN
#  4 STONE_FACE        9 GYPSUM

[texture2]
Name = "SNOW"
Footprint = "EFFECTELEMENT_ICE_MELT3"

[texture8]
Name = "SAND"
Footprint = "EFFECTELEMENT_STEP_SAND"

[texture9]
