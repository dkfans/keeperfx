# Level intros

[CHAPTER_1_INTRO]
ENG = "Our journey begins here, a large cavern which not many heroes have dared to explore. Say goodbye to daylight, torchlight will guide our path for a while. First, let us investigate the area and establish a base camp. Perhaps we can conjure a portal to receive reinforcements underground."
GER = "Unsere Reise beginnt hier, eine massive Höhle die nur wenige Helden bisher erkundet haben. Verabschiedet euch vom Tageslicht, nur der Schein unserer Fakeln wird unseren Weg erleuchten. Lasst uns als erstes eine Basis errichten und die Gegend erkunden. Vielleicht können wir ein Portal beschwören, um auch im Untergrund Verstärkung zu erhalten."

[CHAPTER_2_INTRO]
ENG = "An allied settlement of reclusive Fairies and Dwarves is our next destination. Their craftsmanship is impressive, and they may be able to provide us with some useful tools. Even inside the castle walls, legends speak of their magical candles and mischievous spells."
GER = "Unser nächstes Ziel ist eine befreundete Siedlung von zurückgezogenen Feen und Zwergen. Ihr Handwerk ist beeindruckend, und sie können uns sicherlich mit nützlichen Werkzeugen ausstatten. Selbst im königlichen Schloss erzählt man sich Legenden über ihre magischen Kerzen und zauberischen Fähigkeiten."

[CHAPTER_3_INTRO]
ENG = "Scarlet has a supply route transporting gold that's running through this fiery area. Don't be intimidated by the lava river, milord. The volcano's molten fury reaches far and wide in the underground. Perhaps rally some Giants for battle, their lava resistance may help us."
GER = "Scarlet hat eine Transportroute in dieser feurigen Gegend um seine Versorgung mit Gold zu sichern. Lasst euch nicht von dem Lavafluss einschüchtern, Meistern, auch wenn die Macht des Vulkans bis weit in den Untergrund reicht. Rekrutiert ein paar Riesen, ihre Resistenz gegen Lava könnte uns helfen."

[CHAPTER_4_INTRO]
ENG = "Did you bring a warm coat, milord? It's about to get cold, and the way down is still long. The lava lake that awaits us is an ominous landmark, and Onyx scouts have been found lurking nearby. Inexcusable that they would ally with Scarlet, but all the more reason to wipe them out."
GER = "Habt ihr Euch einen warmen Mantel eingepackt, Meister? Es könnte kalt werden, und der Weg nach unten ist noch lang. Ein ominöser Lavasee erwartet uns hier, und wir haben bereits späher von Onyx in der Gegend gesichtet. Dass sich die Onyx Schurken mit Scarlet zusammengetan haben, ist nur ein weiterer Grund für uns sie auszulöschen."

[CHAPTER_5_INTRO]
ENG = "We are deep in enemy territory and Onyx forces already await us in an ancient, frigid stronghold. Capturing it won't be easy, they hold a strategic advantage, holed up in the middle of a freezing cold lake. Light a torch and let the dwarves ready our digging axes to burrow through the permafrost."
GER = "Wir sind tief im gegnerischen Gebiet, und Onyx Streitkräfte erwarten uns bereits in einer uralten Festung. Es wird nicht einfach sein, die Festung inmitten des eiskalten Sees zu erobern. Zündet eine Fackel an, und lasst die Dunkelzwerge ihre Äxte zum Graben bereithalten, um den gefrorenen Boden zu durchdringen."

[CHAPTER_6_INTRO]
ENG = "Our scouts indicate that this may have once been the base of a Keeper. It has long since fallen into ruin and not much is left of it but rubble and a few stray walls. However, legends say that the Keeper was an expert Geomancer, capable of manipulating the very earth itself. Perhaps some magic of his is left here..."
GER = "Unsere Späher berichten uns, dass hier mal ein Keeper sein Reich hatte. Es ist schon lange in Ruinen zerfallen, und außer Trümmern und ein paar Wänden ist nicht mehr viel übrig. Aber Legenden besagen, dass dieser Keeper ein erfahrener Geomant war, und die Macht besaß, die Erde und Gestein zu manipulieren. Vielleicht hat er etwas von diesem Wissen hier zurückgelassen..."

[CHAPTER_7_INTRO]
ENG = "A sinister cult once held rituals in these halls, a heretical place. We are outmatched here, with both Onyx and Scarlet having surrounded our position. We may need to use the temple here to strengthen our forces, even if it is against the teachings of the church."
GER = "Ein finsterer Kult hielt einst Rituale in diesen Hallen ab. Welch ein unheiliger Ort. Onyx und Scarlet haben uns hier umzingelt, und haben die Überhand. Vielleicht müssen wir den Tempel nutzen, um unsere Streitkräfte zu stärken. Auch wenn den Tempel so zu missbrauchen gegen den Willen der Kirche ist."

[CHAPTER_8_INTRO]
ENG = "The mine and Soul Gem manufactory of Onyx lies ahead. Not only is this area heavily defended as their underground base of operations, it is also vulnerable to heavy volcanic activity. The path will be dangerous and fortified. Ready yourself for a fight."
GER = "Die Mine und Seelenstein-Fabrik von Onyx liegt vor uns. Nicht nur ist dieses Gebiet schwer bewacht und ihre Basis im Untergrund, sondern auch sehr anfällig für vulkanische Aktivität. Der Pfad vor uns wird gefährlich sein, und schwer bewacht. Macht Euch auf einen Kampf gefasst."

[CHAPTER_9_INTRO]
ENG = "We may have saved some of our allies, but many Heroes remain captured in the Scarlet prison. Even the very water here is soaked red from the blood of their prisoners. Let's make haste and rescue our allies from them, but the wardens will certainly be trying to stop us."
GER = "Wir haben einige unserer Verbündeten gerettet, aber viele Helden stecken noch fest im Gefängnis von Scarlet. Selbst das Wasser ist ominös rot gefärbt vom Blut der Gefangenen. Beeilen wir uns und retten wir unsere Helden, aber die Wächter werden sicher versuchen uns aufzuhalten."

[CHAPTER_10_INTRO]
ENG = "Our final battle is upon us. Here lie the ruins of many conquered realms, and the remains of battles past. Defeat the scourge that is Scarlet, so our land will not turn to ruin too."
GER = "Unser letzter Kampf beginnt. Vor uns liegen die Ruinen von eroberten Ländern und vergangenen Kämpfen. Besiegt Scarlet, der unsere Welt plagt, damit unser Land nicht auch in den Ruin fällt."

# Full Moon level

[FULL_MOON_NAME]
ENG = "Caverns of the Full Moon"
GER = "Höhle des Vollmonds"

# Replacement is the percentage number of health left on the door
[MIDAS_DOOR_HEALTH_LEFT]
ENG = "The door's sturdiness is at REPLACEMENT1%."
GER = "Die Standhaftigkeit der Tür liegt bei REPLACEMENT1%."

[MIDAS_DOOR_HALF_DESTROYED]
ENG = "The door is halfway destroyed..."
GER = "Die Türe ist halb zerstört..."

[MIDAS_DOOR_INFORMATION]
ENG = "This door is extraordinarily sturdy. It can be destroyed, but it will take us a while to break through. Split your attention between defending yourself and attacking the door."
GER = "Diese Tür ist außerordentlich stabil. Sie kann zwar zerstört werden, aber es wird eine Weile dauern. Teilt eure Aufmerksamkeit zwischen Verteidigung eures Dungeons, und dem Angriff auf die Tür."

[FULL_MOON_LEVEL_INTRO]
ENG = "A world inside the painting... this appears to be a mirror image of the Trinity Island, after it had been conquered by yet another Keeper, Sapphire. We will not be able to bring anything out of this world, but perhaps it's a good practice skirmish? To escape from here again, conquer the enemy fortress on the far side of the cavern. There must be a portal there we can use to get back out."
GER = "Eine Welt im Gemälde... dies scheint ein Spiegelbild der Insel der Dreeinigkeit zu sein, nachdem es von einem anderen Keeper, Sapphire, erobert wurde. Wir werden nichts von hier zurück in die Außenwelt nehmen können, aber vielleicht ist es eine gute Kampf-Übung. Um wieder von hier zu entkommen, erobert die Festung am anderen Ende dieser Höhle. Dort muss ein Portal sein, mit dem wir zurückkehren können."

[FULL_MOON_PORTAL_ACTIVE]
ENG = "Looks like you can receive reinforcements even here, the portal is active. Make do with what you have, and prepare yourself for enemy resistance."
GER = "Sieht so aus als könnten wir auch hier Verstärkungen erhalten, das Portal ist aktiv. Wir müssen allerdings mit dem klarkommen, was wir hier haben. Bereitet Euch auf gegnerischen Widerstand vor."

[FULL_MOON_WAVE_SPAWNING]
ENG = "Wave REPLACEMENT1 approaches..."
GER = "Welle REPLACEMENT1 ist im Anmarsch..."

[FULL_MOON_HINT]
ENG = "Inside the royal castle's briefing room hangs a painting, next to the bookshelf. They say on a Full Moon, people have vanished inside the painting, never to return... don't ask how I know."
GER = "Im Besprechungsraum des königlichen Schlosses hängt ein Gemälde, neben dem Bücherregal. Man sagt an einem Vollmond sind Leute in diesem Gemälde verschwunden, und nie wieder zurückgekehrt... frag mich nicht, woher ich das weiß."

[BOX_OF_SECRETS]
ENG = "Box of Secrets"
GER = "Box der Geheimnisse"

[FULL_MOON_LEVEL_END]
ENG = "Thankfully we got out of here again. Good work!"
GER = "Zum Glück konnten wir von hier entkommen. Gute Arbeit!"

[FULL_MOON_REMINDER]
ENG = "Milord, you know you are supposed to beat the enemy and not just wait around, right...?"
