GER = "Heldentor Invasion"

[PORTAL_INVASION_TOOLTIP]
ENG = "Portal Invasion: Recruits a party of Heroes from the overworld. Can be charged to recruit stronger parties."
GER = "Heldentor Invasion: Rekrutiert eine Gruppe von Helden aus der Oberwelt. Kann aufgeladen um stärkere Gruppen zu rekrutieren."

[APPOINT_AVATAR]
ENG = "Appoint Avatar"
GER = "Avatar Ernennen"

[APPOINT_AVATAR_TOOLTIP]
ENG = "Appoint Avatar: Turns the selected creature you own into the Avatar!"
GER = "Avatar Ernennen: Verwandelt die gewählte Kreatur in den Avatar!"

[ENFEEBLE_TRAP]
ENG = "Enfeeble Trap"
GER = "Schwächende Falle"

[ENFEEBLE_TRAP_TOOLTIP]
ENG = "Enfeeble Trap: Causes creatures that step on it to lose power and level down."
GER = "Schwächende Falle: Kreaturen die auf diese Falle treten verlieren Kraft und ihr Level sinkt um 1."

[THIEVING_TRAP]
ENG = "Thieving Trap"
GER = "Stehlende Falle"

[THIEVING_TRAP_TOOLTIP]
ENG = "Thieving Trap: Steals gold from creatures that step on it and deals damage relative to gold dropped."
GER = "Stehlende Falle: Stiehlt Gold von Kreaturen die drauf treten und fügt Schaden relativ zum verlorenen Gold zu."

