# Daimon, the layered keeper AI (docs/plans/ai-plans/v2/). Global sections first, then the personalities.
# Every key here has a reader: a test fails on a key nothing reads (lesson L5).
# Mods, campaigns and levels may override any key (the usual fxdata / campaign / map%05d.daimon.toml order).

[budgets]
# Slabs a keeper's knowledge re-reads each turn in its rolling scan (a 170x170 map: one full pass in 113 turns at 256).
slab_scan = 256
# Slab visits a keeper's reach map may make each turn while it floods the map again after a change (03 section 5;
# a 170x170 map: about 30k visits for the seeds and 4 a reached slab, so a new map every 10-30 turns at 4096).
reach_visits = 4096
# Nodes a keeper's dig searches may expand each turn (03 section 7.2: a whole 170x170 map in about 4 turns). Planning
# runs on its own thread (12 section 13.11): 4x Phase 1's 2000 (and 4x the layout and route budgets) costs that thread
# about a fifth more time and the main thread nothing; 8x gained nothing more in play.
search_nodes = 8000
# Dig searches a keeper runs at once (at most 4); another waits for one to finish.
max_searches = 2
# Sites the layout planner weighs each turn (04 section 5.3; about 1,900 for a room within radius 12: 8 turns).
layout_candidates = 256

[dig_costs]
# The dig search's price of entering a slab, in turns of imp work (03 section 7.1). Rock, gems, another keeper's
# walls, rooms and doors, and liquid no bridge can cross are never entered. Water is walked through.
floor = 1
earth = 20
# Gold and dense gold on the way to somewhere else: allowed, never preferred.
gold_route = 200
dense_route = 500
# The keeper's own fortified wall: its imps dig it, ten times as long as earth (block health 20 to earth's 2: P9,
# dai_build_basic -- a lair grown onto its own fortified walls, priced as earth, stood 1,500 turns undug, the lair full).
own_wall = 200
enemy_floor = 80
# A bridge slab over lava (or abyss, when the bridge may cross it): this plus its price in gold, at the
# personality's gold_to_turns.
bridge_base = 10
# Added to ground next to an abyss: an imp working there can be knocked in.
abyss_edge = 5
# Above 1 the search may return a dearer route for less work (1: always the cheapest).
heuristic_weight = 1.0
# The attacker's costs (07 section 4.2): another keeper's claimed floor and rooms (its imps convert them, contested),
# its doors per point of their health as last seen (the assault bashes them), and one of its revealed fortified walls
# opened by a Destroy Walls cast -- 0: the power's price through the personality's gold_to_turns. Walls not yet seen
# are unknown ground; rock and gems never.
creep_cost = 60
door_cost_per_hp = 0.05
destroy_walls_cost = 0

[excavation]
# A dig route marks at most this many slabs ahead of the last one dug (03 section 7.3).
marks_ahead = 12
# Open marks mining keeps on one vein.
mine_marks = 10
# A route is searched again when what is left of it costs this much more than planned.
replan_ratio = 1.5
# Turns between rescoring the veins, entrances and neutral rooms (03 section 8.2).
rescore_interval = 250
# Turns a finished route to an entrance or room may wait for imps to claim it before it counts as blocked.
claim_window = 2000
# Turns before an unreachable vein is tried again (sooner when something near it changes).
unreachable_retry = 3000
# Veins mined at once, at most.
max_veins = 3
# Share of the keeper's 300 dig marks Excavation may hold, leaving the rest for later phases and the imps' own stack.
marks_share = 0.6

[workforce]
# Turns between working out how many imps the keeper needs (03 section 8.3).
interval = 100

[programme]
# Turns between the director working out which rooms the keeper wants and how big (sooner when its creatures or rooms
# change; 04 section 4).
interval = 500
# Lair space kept free for creatures still to come, in creatures. 4 since P2.10: a creature comes every ~250 turns and
# a lair grows in ~1,100, so 2 left the lair full for 1,200 turns on original level 60.
lair_spare = 4
# Pay days of gold the keeper must have in hand before it wants a training room.
train_runway = 2

[layout]
# How far (slabs) from its anchor the layout planner looks for a room's site (04 section 5.1).
radius = 12
# The ring a site keeps between itself and any other room: one slab of wall (2: two).
rim = 1
# Turns a site the planner found stays good to build on (if nothing in it has changed since; 04 section 5.3).
cache_turns = 2000
# A room is grown when this share of its capacity is used (or its goal wants more slabs than it has).
grow_at = 0.85

[construction]
# Rooms built (placed or grown) at once; the game takes one room drag at a time anyway (04 section 6). 2 since P2.10:
# with one, a full lair waited ~1,100 turns behind a hatchery strip and turned creatures away (original level 60).
room_build_concurrency = 2

[creatures]
# Hand trips putting creatures to work, at most, each 1,000 turns: every trip is a gesture, and holding a creature
# angers it (04 section 7.3).
moves_per_kturn = 6
# Turns a livid creature is given for its anger's cause to be put right before it is dismissed (04 section 7.4).
livid_grace = 600
# Scavenging (08 section 7a): at most scavengers_max creatures in its scavenger room, the kinds weighed every
# scavenge_interval turns. With no rival's creature of the kind in sight, the pool is tried (a human cannot see what is
# left in it): pool_try_turns with nothing come, and the kind is dry for pool_dry_turns.
scavengers_max = 4
scavenge_interval = 500
pool_try_turns = 2000
pool_dry_turns = 10000

[economy]
# A keeper starts keeping its next wages (and the personality's margin over them) back this many turns before pay
# day (03 section 6).
reserve_window = 2500

[inbox]
# Turns an unhandled event stays in a keeper's inbox, by kind of fact (01 section 8.1). A repeat of the same event in
# the same place refreshes it instead of adding another.
expiry_payday_quarter = 500
expiry_event = 1000
expiry_objective = 2000
expiry_custody = 1000
expiry_sacrifice = 1000
expiry_vampire_progress = 1000
expiry_wall_cue = 600
expiry_assist_refusal = 600
expiry_sight_open = 200
expiry_loss = 1000
expiry_loss_scan = 300
expiry_intruder = 300
expiry_trap_fired = 300
expiry_enemy_trap = 600
expiry_victory = 100000
expiry_new_kind = 2000

[arbiter]
# Most gestures a domain with runnable work may wait for before it runs (deficit round robin, 01 section 8.4).
quota_window = 8
# Utility a waiting job gains per 1000 turns it waits, x1024.
age_bonus_per_kturn = 256
# Each domain's share of the gestures while several have work (credit gained per gesture, deficit round robin).
weight_economy = 1
weight_workforce = 1
weight_excavation = 1
weight_construction = 1
weight_creatures = 1
weight_custody = 1
weight_defence = 1
weight_offence = 1
weight_magic = 1
weight_tactics = 1

[jobs]
# Turns a job may go without progress before it is Blocked (01 section 8.2).
stall_window = 600

[net]
# Turns between the host's copies of Daimon's state to the clients (01 section 10.6).
replicate_interval = 200

[threads]
# Threads Daimon's keepers plan on (12 section 5): -1 one per keeper, at most the logical cores less reserved_cores; a
# positive number caps it (keepers past it share workers); 0 none, the planning runs on the main thread. The decisions
# are the same whichever is chosen.
workers = -1
reserved_cores = 2
# Test mode: each planning turn waits a random 0..jitter_us microseconds first (the results must not change). 0: off.
jitter_us = 0
# A planning turn's gestures land D turns after the turn it was planned from (12 section 4): D is the game's speed --
# turns a second, times the fast-forward (Ctrl +/-) -- over this, rounded up, at least 1: at the default speed 1, at 8x
# fast-forward 8. The wall time a keeper has to plan stays the same whatever the speed.
base_turns_per_second = 20

[director]
# Turns between the director weighing its postures (05 section 6.2: opening, build_up, expand, contest, recover; 06:
# defend; 07: raid, assault);
# recover's triggers are checked every turn and switch at once.
director_interval = 250
# How much a posture's score must beat the current one's by (scores run 0-1000) before the director switches.
switch_margin = 64
# Turns build_up may last before the director looks past it even with rooms below their size.
build_up_max_turns = 12000
# Slabs from the keeper's rooms within which a rival keeper's ground means contest; and, in contest, mining keeps to
# three times this from the heart.
contest_radius = 12
# Turns after a rival was last seen that its ground or strength stops counting.
contest_forget = 3000
# Turns a loss (a room gone, half the creatures gone) keeps recover wanted unless it is put right sooner.
recover_window = 3000
# Turns after an attack operation ended (won or given up) before the director takes up raid or assault again
# (07 section 5).
attack_rest = 2000

[pace]
# World gestures a keeper may make in any 1000 turns, by its difficulty's pace (05 section 7.2): a human's rate for
# normal (400, until replays of good human play calibrate it; Q1), half that or less for easy, no cap for hard (one a
# turn is the controller's own limit).
relaxed = 150
human = 400
unlimited = 1000

[cheats]
# What a keeper's cheats give it, named after its difficulty ("hard+rich_start+stronger_creatures"; 05 section 7.3):
# gold at the take, its creatures' health, strength and armour up by this percentage, their pay down by this one.
# (sees_all, the third, only lifts the fog for Daimon's own reading of the map.)
rich_start_gold = 10000
creature_bonus_pct = 25
pay_discount_pct = 25

# The difficulties (05 section 7), apart from the personality: any personality plays at any difficulty. Each keeper's
# director, programme and vein-rescore intervals are times interval_scale (2.0: it reacts half as often; its creatures'
# work trips a 1000 turns divided by it); its search budgets (reach visits, dig search nodes, layout sites) times
# budget_scale; a noise share of its choices goes to the second-best job; and it sees to an angry, hungry or wounded
# creature only care_delay turns after the need began; and it makes at most [pace]'s gestures a 1000 turns at its pace
# ("relaxed", "human" or "unlimited"). These three are built in with these values; a table here overrides them or adds
# a new one (DAIMON_PLAYER and the setup screens name it).
[threat]
# The threat model (06 section 3): where enemies are and how they would come. Every `interval` turns each enemy the
# keeper sees adds its force to the slabs within its reach (1 + its speed / speed_per_slab slabs); that influence
# halves every `halflife` turns.
interval = 25
halflife = 1500
speed_per_slab = 16
# Every check_interval turns the sources are looked at again (rival ground, hero gates, the frontier where open ground
# not the keeper's meets its own); the predicted routes from them to the heart, treasury and library are searched again
# every route_interval turns, or at once when a source is new or the frontier moved (a breach). search_nodes: the
# route searches' nodes a turn.
check_interval = 100
route_interval = 1000
search_nodes = 4000
# The keeper's defences as a rival sees them. A fortified wall stops everyone but its owner: imps never dig another
# keeper's walls, only a Destroy Walls cast breaks them; destroy_walls > 0 prices one wall slab so (turns), as if
# rivals had the power -- 0: walls stop them. Its doors are broken through, at own_door_per_hp turns a point of health.
destroy_walls = 0
own_door_per_hp = 0.25
# A route's weight: a rival's known force; the frontier's and a hero gate's when nothing is known of who comes.
frontier_weight = 50
hero_weight = 200
# The chokepoints kept: one-slab-wide places on the routes, the busiest first.
max_chokepoints = 16

[diplomacy]
# Alliances (07 section 5a), weighed every `interval` turns: one is proposed once the value has held for ally_dwell
# turns, never within peace_after_war turns of the last fight with that keeper; ALLIANCE_LOCKED levels are left alone.
interval = 250
ally_dwell = 2000
peace_after_war = 10000

[tactics]
# Tactics, the one decider in fights (06 section 5): it looks at its engagements every fight_tick turns while there are
# any, every idle_tick turns otherwise.
fight_tick = 2
idle_tick = 50
# Fights come in bursts: past the difficulty's pace cap, Tactics may still make up to burst_turns gestures in the pace
# window (the other domains wait the longer afterwards, so the total over time holds).
burst_turns = 60
# An enemy not yet fighting is a contact when on the keeper's ground, within contact_radius slabs of an objective's area,
# or on a predicted route; an engagement serves the objectives whose area, widened by match_margin slabs, holds it.
contact_radius = 6
match_margin = 2

[defence]
# Defence (06 sections 4, 5.2, 6): every `interval` turns it posts its standing objectives -- the heart always, a room
# whose box holds at least area_threat of the threat map, imps at work where it holds at least imps_threat -- and plans
# the fortification. An intruder seen, or an alarm trap going off, is an Intercept for intercept_turns turns.
interval = 100
area_threat = 50
imps_threat = 50
# Doors not on the keeper's own creatures' ways are locked while an enemy is within lock_radius slabs (Q6).
lock_radius = 10
# The most traps and doors it plans (the personality's trap_usage and door_preference take a share of them).
max_traps = 8
max_doors = 4
intercept_turns = 600
# The director's defend posture (06 section 11): entered at once on an enemy force on the keeper's ground (its
# creatures' levels, imps apart, at threat_force or more: a lone scout or a working imp is Tactics' alone), a breach,
# its own alarm or its heart hurt; left once none of these has come for defend_cooldown turns. While in it, Defence takes
# four times its share of the gestures and building slows. The same force engaging a Defence objective is the fight at
# home that holds back an attack (07 P5.12).
defend_cooldown = 1500
threat_force = 4
# The most guard posts a keeper whose personality wants them (guard_posts) asks for, each beside a busy chokepoint.
max_guard_posts = 2
# Hazards (07 P5.13): a neutral's or the heroes' trap the keeper sees, never re-armed, by which (within hazard_reach
# slabs: a lightning bolt reaches four) hazard_imps of its imps were lost within hazard_window turns. While one is hot,
# no new mining marks go near it, imps are bought no faster than one every hazard_rebuy_turns, its imps there are
# warded (Protect, Speed) while the spell costs under ward_share of an imp, and it is sealed off: a door locked where
# no walk from the heart reaches the trap's slab round it (the workshop is asked for one when none is in stock) --
# imps claim the ground by a trap and pick up the gold there unasked, marks or none.
hazard_imps = 2
hazard_window = 3000
hazard_reach = 4
hazard_rebuy_turns = 600
# Below this many imps no brake holds (hazard or not): an imp is bought with whatever gold there is, wages or no -- the
# imps are what earns them (level 52: lightning traps by a vein left a keeper one imp and no gold for 40,000 turns).
hazard_imps_floor = 3
ward_share = 0.25
# Spending one (a creature walks onto its trap to use up its shots, when something the keeper wants lies past it): the
# creature of least force (the seat's rating: its kind's score at its level, times its health; nothing for one immune
# to the trap) whose force is no more than the trap's rating -- the force of the imps it took, scaled by the need:
# 1 + what lies past it (its veins' gold in units of spend_gold_imps imps' price, up to 4, any gems 4; up to 2 for a
# chokepoint within its reach; 1 if the keeper's own creatures walk there), times the gold: up to four times over when
# the keeper's gold is below spend_gold_imps imps' price (the price rises with every imp it has), down to a quarter
# when well above it. The seal stands either way (the creature is dropped past it).
spend_gold_imps = 4
# Holding the way in (plan 13 L3): with the force estimate against it ([offence] response_share) and a chokepoint on
# its own side under threat (the most threatened), the keeper asks for a guard post by it and keeps the personality's
# hold_share % of its free fighters there by hand, each for hold_turns turns before it goes back to work (another
# takes its place while the hold lasts).
hold_turns = 1500

[custody]
# Custody (08 sections 4-6, 17): every plan_interval turns (and on a custody fact) each prisoner is given the plan worth
# most -- convert or interrogate (the rack), a skeleton (left unfed in prison), a ghost (the rack, no heals), held, or
# dismissed to make room. The imprison tendency is on while a prison has prison_spare places free; a victim kept alive is
# healed below heal_victim_below % of its health; an interrogation is worth interrogate_value (on the creature score
# table's scale: a level 3 spider scores 9) against a keeper whose heart is unknown; a prisoner held is worth hold_share of its force.
plan_interval = 200
prison_spare = 2
heal_victim_below = 40
interrogate_value = 10
hold_share = 0.25
# The temple (08 section 7.2): a recipe completed is worth its outcome on the same scale -- a summoned creature its
# kind's score at its level; research or manufacture completed research_value, manufacture_value; all made happy
# happy_value for each angry creature; a blessing bless_value for each creature it reaches; cheaper imps the imp price's
# step (imp_price_step gold) on every imp to come, less the one given up -- less what the victims are worth. The imps
# to come: those the workforce still wants, or as many as were made lately (bought back after losses) over the next
# imp_horizon turns, whichever is more.
research_value = 20
manufacture_value = 10
happy_value = 2
bless_value = 1
imp_price_step = 150
imp_horizon = 20000
# A graveyard (its imps carry bodies there to rise as vampires) once graveyard_bodies bodies lie on revealed ground at once.
graveyard_bodies = 3
# A jailbreak (08 section 10): a creature of its own in another keeper's prison or torture chamber, worth
# jailbreak_min_force (its force x the personality's rescue_value): its imps tunnel to a slab beside that prison and
# claim it (the creature escapes from a prison that touches its keeper's land), its creatures escorting; given up after
# jailbreak_timeout turns, not tried again for jailbreak_retry.
jailbreak_min_force = 5
jailbreak_timeout = 10000
jailbreak_retry = 5000

[abilities]
# A creature's abilities' worth (P9), as damage-equivalents, from the creature, instance, shot, spell and effect configs:
# each use fitted into the creature's 100 turns by what a turn of casting is worth (a use holds it for the instance's
# Time, and comes again after its ResetTime), melee in the same turns. Training is worth more to a creature by the share
# of its output its next two levels' abilities add. An area of radius r subtiles hits 1 + area_density x pi (r / 3)^2
# enemies (area_max at most), area_falloff of its damage each; a beam (lightning, drain) or a boulder passes through
# beam_targets; no hit is worth more than enemy_hp; a hailstorm's pellets hit hail_hit of them; knocked back at full
# strength (word of power, grenade, wind) an enemy is out of the fight knock_turns turns; an enemy deals enemy_damage
# in 100 turns, what a disable (freeze, slow, fear, chicken) or a buff (armour, invisibility, speed) keeps from it,
# ranged_share of it in shots a rebound turns back onto another (counted twice). Teleport (instant travel over the
# keeper's ground) and sight (the counter to conceal and invisibility) are worth teleport_value and sight_value in
# 100 turns, outside the fight.
area_density = 0.25
area_max = 4
area_falloff = 0.6
beam_targets = 2.5
enemy_hp = 800
hail_hit = 0.35
knock_turns = 40
enemy_damage = 400
ranged_share = 0.4
teleport_value = 150
sight_value = 35
# A trap's worth while triggered (DaiTrapRating) holds only while its charges last within a fight of trap_fight_turns
# turns (an engagement's length): Shots x TimeBetweenShots of firing, then it waits for a new crate -- Word of Power's 3
# shots fire for 252 turns, lightning's 6 for 840, a sentry's 255 never run out. A one-shot trap (boulder, TNT) is
# worth its shot, as before: what it hits it mostly kills.
trap_fight_turns = 1000
# A kind reborn at its lair (a level lower) when killed from its Rebirth level (a vampire's 3) is very hard to lose: its
# output counts rebirth_value more from that level (so training to it is worth more). Scavenging by an alluring kind
# (ALLURING_SCVNGR, a vampire) with nothing of its kind to lure speeds the portal for any kind: worth allure_value of a
# level-1 creature from the pool each lure's worth of scavenging.
rebirth_value = 0.5
allure_value = 0.5

[offence]
# The rivals (07 section 3): each rival keeper's estimate -- its heart if seen, its force (KnownForce and its lairs and
# training rooms seen), how it has treated the keeper (hate: ground and rooms it took, its creatures on the keeper's
# ground; halved every hate_halflife turns), its targets (its heart, its rooms, its portals, each with the defence seen
# within defence_radius slabs) -- looked at every `interval` turns; the attacker's route to each target searched every
# route_interval turns (search_nodes nodes a turn). An attack waits until the forecast covers attack_runway pay days.
interval = 250
route_interval = 1000
search_nodes = 4000
hate_halflife = 3000
attack_runway = 2
defence_radius = 5
# An operation (one at a time, while the director wants one) is looked at every op_interval turns: recon gives up after
# recon_timeout turns (a Sight of Evil peek at sight_level), stage after stage_timeout, breach after breach_timeout turns
# in which the way to open got no shorter or after max_refusals refused digs and casts, an assault withdraws after
# assault_timeout; a withdrawal takes withdraw_turns, and the target is then left alone for retry_after turns.
op_interval = 50
recon_timeout = 4000
stage_timeout = 12000
breach_timeout = 6000
assault_timeout = 6000
withdraw_turns = 1500
retry_after = 6000
sight_level = 2
max_refusals = 3
# Tactics serves an assault (07 section 4.3): the banner gathers the fighters at the staging point until gather_share %
# of those it may send (all free fighters but the home guard) stand there, or gather_turns have passed, then goes onto
# the target; meanwhile the hand drops fighters at the staging point, at most waves_per_kturn trips a 1000 turns.
gather_turns = 600
gather_share = 60
waves_per_kturn = 8
# Raids (07 section 4.4), one at a time beside an operation (not while it assaults or withdraws), the next
# raid_interval / the personality's raid_appetite turns after the last: a portal of the rival's that touches the
# keeper's land crept onto by creep_imps imps under the group's escort; the group on the rival's imps seen within
# raid_border slabs of the keeper's land; the banner on a room of the rival's within raid_border for harass_turns, then
# withdrawn. A raid not over by raid_timeout turns is given up.
raid_interval = 3000
raid_timeout = 3000
harass_turns = 600
raid_border = 6
# With the force estimate for it -- the free fighters, the home guard left, at superiority_to_attack % of a rival room's
# defence with response_share % of its force -- and nothing within raid_border, the imp hunt and the harass look this
# far from the keeper's land (plan 13 L2: a rival behind a lava lake mined in peace).
raid_reach = 30
creep_imps = 4
# After a heart falls (07 section 8): the loser's rooms crept onto, portals first, until none is left seen or
# exploit_turns have passed.
exploit_turns = 4000

[difficulty]

[difficulty.easy]
interval_scale = 2.0
budget_scale = 0.5
noise = 0.2
care_delay = 600
pace = "relaxed"

[difficulty.normal]
interval_scale = 1.0
budget_scale = 1.0
noise = 0.0
care_delay = 0
pace = "human"

[difficulty.hard]
interval_scale = 0.75
budget_scale = 1.5
noise = 0.0
care_delay = 0
pace = "unlimited"

# The personalities. (The [personality] line must stay: this game's TOML reader cannot open [personality.x] before it.)
[personality]

# Each personality's own header (not inherited): its name in the setup screens (a name_text_id above 0 names a
# translated string instead), what it is like, and whether Skirmish's "random" may pick it (false when left out).
# Its other tables hold the keys below; a personality names its parent with `inherits` (default when left out).
[personality.default]
name = "Default"
description = "Balanced: the base every other personality inherits from."
# Steward plays as it does and stands in for it among the random picks.
skirmish_pool = false

[personality.default.workforce]
# The imps a keeper keeps: never fewer than imps_min (bought whenever the gold covers the next wages), never more than
# imps_max; in between, as many as the work needs (an imp for work_per_imp open marks, claims and mining faces) or the
# land does (an imp for slabs_per_imp owned slabs).
imps_min = 4
imps_max = 24
work_per_imp = 4
slabs_per_imp = 25
# Share of working imps kept hurried by slaps (0: never slap), and the turns between slaps. 0.25 since Phase 1's
# benchmark (Q2): ahead on every map by turn 20,000, by 1-13 % gold mined and 23-62 % gold banked.
slap_share = 0.25
slap_interval = 200
# Above imps_min, an imp may cost at most this share of the gold that may be spent. Each imp costs more than the last
# (150 gold more for every imp owned), so this is what stops the buying: 0.25 from 10000 gold and 3 imps buys up to 9
# and keeps about 4000; 1.0 would spend everything on imps.
imp_gold_share = 0.25
# Tunnellers (the tunneller summon, where the level has it) bought instead of imps when one -- its price and
# tunneller_paydays of its pay (it is a creature, and paid) -- comes cheaper than the next imp (1), or never (0).
tunnellers = 1
tunneller_paydays = 10
# Imps trained (an imp learns speed at level 3 and teleport at 10, travelling to every task at once): up to train_imps
# at a time, dropped in a training room while the director trains and the gold holds twice the training runway, to
# imp_train_level -- with imp_train_rich_runway pay days of gold in hand, to imp_train_rich_level -- then dropped
# back to work. Only the imps above imps_min; 0 never.
train_imps = 2
imp_train_level = 3
imp_train_rich_level = 10
imp_train_rich_runway = 12

[personality.default.economy]
# The wage reserve's margin over the wage bill: 0.25 keeps a quarter more than the wages back.
reserve_margin = 0.25
# Pay days the gold and income must cover before Economy stops pressing for gold.
comfortable_paydays = 3
# The gold outlook (P9, plan 13). The keeper knows the map's gold as a human does in its seat: every gold and gem slab
# from the start, shroud where it is mined out of sight. Its income lasts while its side's gold does -- veins nearer
# its heart than a seen rival's, half of those within gold_contest_share % as near (with no rival heart seen, the
# map's gold over the keepers) -- or for ever with a gem face held. bank_paydays pay days' wages are kept in hand; the
# rest is spare and goes to work (training first). Extra rooms (prison, torture, temple, graveyard, scavenger) only
# while the income lasts extras_horizon turns or more: level 124, 395,000 gold on the map and no gems, banked 35,000-
