name: Save format check

# Reports pull requests that change the layout of data the game saves as raw
# memory (saved games, continue file, replays, high scores, network config,
# multiplayer resync). Runs untrusted PR code, so it has read-only permissions
# and only writes to the job summary and an artifact.

on:
  # No path filter: every PR update must re-run, so an earlier "breaks saves"
  # result is cleared when the change is reverted. The job exits early when no
  # relevant file changed.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  save-format:
    name: "Save format check"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Find base and scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -eu
        base=$(git merge-base "$BASE_SHA" HEAD)
        echo "base=$base" >> "$GITHUB_OUTPUT"
        if git diff --quiet "$base" HEAD -- 'src/**.h' 'src/**.hpp' 'src/*.h'             config/fxdata/lua/core/serialisation.lua config/fxdata/lua/external/binser.lua             build/cmake/modules/Dependencies.cmake tools/save-layout .github/workflows/save-format-check.yml; then
          echo "relevant=false" >> "$GITHUB_OUTPUT"
        else
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install tools
      if: steps.scope.outputs.relevant == 'true'
      run: |
        set -eux
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 gdb-multiarch python3

    - name: Compare with base
      id: compare
      env:
        BASE: ${{ steps.scope.outputs.base }}
        RELEVANT: ${{ steps.scope.outputs.relevant }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -eu
        if [ "$RELEVANT" = "true" ]; then
          verdict=$(bash tools/save-layout/check_pr.sh "$BASE" save-format)
        else
          mkdir -p save-format
          verdict=$(python3 tools/save-layout/compare.py tools/save-layout/roots.txt /dev/null /dev/null             save-format/result.json save-format/summary.md)
        fi
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        # For save-format-report.yml, which comments on the PR.
        echo "$PR_NUMBER" > save-format/pr_number
        cat save-format/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: save-format-result
        path: |
          save-format/result.json
          save-format/summary.md
          save-format/pr_number
          save-format/base.tsv
          save-format/head.tsv

    - name: Apply policy
      env:
        VERDICT: ${{ steps.compare.outputs.verdict }}
        ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'save-break-accepted') }}
      run: |
        set -eu
        flags=$(python3 -c "import json; print(len(json.load(open('save-format/result.json'))['flag_dependent_fields']))")
        if [ "$flags" != "0" ]; then
          echo "::error::The saved layout depends on BFDEBUG_LEVEL/FUNCTESTING. See the job summary."
          exit 1
        fi
        case "$VERDICT" in
          identical|compatible)
            exit 0 ;;
          refused|silent)
            if [ "$ACCEPTED" = "true" ]; then
              echo "::warning::This PR breaks saves; accepted with the save-break-accepted label."
              exit 0
            fi
            echo "::error::This PR breaks saves ($VERDICT). See the job summary for the changed fields."
            exit 1 ;;
          *)
            echo "::error::Unexpected verdict '$VERDICT'"
            exit 1 ;;
        esac
